# ==============================================================================
# SkyBridge Tech Innovations Ltd. - Azure App Service CI/CD Pipeline
# Workflow: Build, Test, and Deploy Node.js Web App to Azure App Service
# Target: app-skybridge-portal-jay2026 (Linux Node.js 20/24 LTS)
# ==============================================================================

name: Build and Deploy to Azure Web App - SkyBridge CloudMart

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-skybridge-portal-jay2026 # Your Azure Web App Name
  NODE_VERSION: '20.x'                           # Node.js LTS version

jobs:
  build:
    name: 🏗️ Continuous Integration (Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Production & Dev Dependencies
        run: npm ci

      - name: Syntax and Integrity Check
        run: node -c server.js

      - name: Package Build Artifact
        run: |
          mkdir -p build_artifact
          cp -r public build_artifact/
          cp server.js build_artifact/
          cp package.json build_artifact/
          cp package-lock.json build_artifact/
          cd build_artifact && zip -r ../release.zip .

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    name: 🚀 Continuous Deployment (Azure App Service)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App via Azure Publish Profile
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
